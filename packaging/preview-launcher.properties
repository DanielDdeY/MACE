# Launcher secundario MACE-Preview.exe: datos simulados, sin DLL y sin manifiesto de
# administrador (package-windows.bat solo incrusta app.manifest en MACE.exe).
# El escenario puede cambiarse con -Dmace.mock.scenario=<NOMBRE> en este archivo.
java-options=--enable-native-access=ALL-UNNAMED -Dmace.infra.mode=mock -Dmace.mock.scenario=NORMAL
description=MACE - vista previa con datos simulados
