name: Entrega continua - Instalador de Windows

# Construye el instalador de MACE (sin firma) al subir un tag:
#
#     git tag v1.1.0-rc1 ; git push origin v1.1.0-rc1   -> pre-release (pruebas)
#     git tag v1.1.0     ; git push origin v1.1.0       -> version estable
#
# Flujo: CI completo (compuerta) -> helper LHM -> DLL de produccion ligada al
# helper -> app-image verificada (hash, ABI, payload) -> coordinador PawnIO ->
# instalador Inno (installer/inno/mace.iss) -> Release.
# Un push a feat/instalador-** ejecuta todo y deja solo el artefacto de prueba.
#
# PUBLICACION BLOQUEADA: no se publican releases nuevas con binarios de
# terceros hasta cerrar la revision legal (ver helper/PENDIENTE-FASE-3B.md).
# Mientras la variable de repositorio MACE_PUBLICAR_RELEASES no valga 'true'
# (Settings > Secrets and variables > Actions > Variables), el flujo NO crea ni
# actualiza GitHub Releases: deja el resultado como artefacto de prueba del run,
# con retencion corta. Activarla es decision del mantenedor tras esa revision.
#
# PawnIO: se incluye el instalador OFICIAL 2.2.0 intacto (hash y firma
# verificados) en app\prerequisites. MACE no lo ejecuta: instalarlo es
# opcional y decision del usuario. Sin PawnIO, MACE muestra igualmente
# uso de CPU, RAM, procesos y GPU NVIDIA/Intel.
#
# Tambien se puede lanzar a mano: Actions > este flujo > Run workflow,
# eligiendo un TAG en "Use workflow from".

on:
  push:
    tags: [ 'v*' ]
    # Ramas de desarrollo del instalador: solo artefacto de prueba, nunca Release.
    branches: [ 'feat/instalador-**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entrega-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 1. Compuerta: no se publica nada si falla alguna prueba del CI.
  ci:
    uses: ./.github/workflows/build-and-test.yml

  # 2. Empaquetado y publicacion.
  instalador:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    # pwsh (PowerShell 7) para los pasos propios: escribe GITHUB_ENV sin BOM y
    # redirige la salida de gh sin errores. Los scripts del repositorio se siguen
    # ejecutando con Windows PowerShell 5.1 (powershell.exe -File), como pide la guia.
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: helper/global.json

      # jpackage exige version numerica: v1.1.0-rc1 -> 1.1.0 y se marca pre-release.
      # Fuera de un tag (ramas del instalador) se usa 1.0.0 y solo hay artefacto.
      - name: Version desde el tag
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            "MACE_APP_VERSION=1.0.0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "MACE_PRERELEASE=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            exit 0
          }
          if ($env:TAG -notmatch '^[vV](\d+(\.\d+){0,2})(-[0-9A-Za-z.]+)?$') {
            Write-Error "El tag '$env:TAG' debe tener la forma v1.2.3 o v1.2.3-rc1."
            exit 1
          }
          "MACE_APP_VERSION=$($Matches[1])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $pre = if ($Matches[3]) { '1' } else { '0' }
          "MACE_PRERELEASE=$pre" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publicar helper LHM
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\helper\Build-Helper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Compila la DLL de produccion ligada al manifiesto del helper recien publicado.
      - name: Paquete nativo de produccion
        run: |
          $helper = (Get-Content -LiteralPath .\helper\artifacts\latest.txt -Raw).Trim()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\native\scripts\package-native.ps1 -HelperDirectory $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem native\dist -Directory -Filter 'mace-native-*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pkg) { Write-Error 'package-native.ps1 no genero el paquete.'; exit 1 }
          "MACE_NATIVE_LIB=$($pkg.FullName)\bin\mace_native.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MACE_HELPER_PUBLISH=$helper" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Descarga oficial; stage-runtime.ps1 rechaza el archivo si el SHA-256 o la firma no coinciden.
      - name: Instalador oficial de PawnIO (no se ejecuta)
        run: |
          $policy = Get-Content -LiteralPath packaging\pawnio-2.2.0.json -Raw | ConvertFrom-Json
          $dir = Join-Path $env:RUNNER_TEMP 'pawnio'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $policy.file
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $policy.url -OutFile $file -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          if ($hash -ne $policy.sha256) { Write-Error "Hash de PawnIO inesperado: $hash"; exit 1 }
          "MACE_PAWNIO_INSTALLER=$file" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Verifica hash/ABI de la DLL, payload (helper, PawnIO, licencias) e imagen.
      - name: Empaquetar app-image
        shell: cmd
        run: call packaging\package-windows.bat app-image

      # Binario de producto del coordinador, sin ganchos de prueba.
      - name: Compilar coordinador de PawnIO
        run: |
          cmake -S installer\coordinator -B installer\coordinator\build-release -A x64 -DMACE_COORDINATOR_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build installer\coordinator\build-release --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # D1: Inno Setup 6 (motor y desinstalador sin firma propia; ver README de installer/).
      - name: Inno Setup 6
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path -LiteralPath $iscc)) { Write-Error 'No se pudo instalar Inno Setup 6.'; exit 1 }
          "MACE_ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Instala MACE y despues, con consentimiento, PawnIO mediante el coordinador.
      - name: Crear instalador (Inno)
        run: |
          $root = (Get-Location).Path
          $image = Join-Path $root 'packaging\dist\MACE'
          $coordinator = Join-Path $root 'installer\coordinator\build-release\Release\mace-pawnio-setup.exe'
          & $env:MACE_ISCC "/DAppVersion=$env:MACE_APP_VERSION" "/DAppImage=$image" "/DCoordinator=$coordinator" "/O$root\packaging\dist" installer\inno\mace.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar archivos de descarga
        run: |
          $dist = 'packaging\dist'
          if (-not (Test-Path "$dist\MACE-Setup.exe")) { Write-Error "Inno no genero MACE-Setup.exe en $dist."; exit 1 }
          Compress-Archive -Path "$dist\MACE" -DestinationPath "$dist\MACE-portable.zip" -Force
          $files = 'MACE-Setup.exe', 'MACE-portable.zip', 'MACE-native-report.txt'
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 "$dist\$_").Hash.ToLowerInvariant(), $_
          } | Set-Content "$dist\SHA256SUMS-MACE.txt" -Encoding utf8
          Get-Content "$dist\SHA256SUMS-MACE.txt"

      # Publicacion bloqueada por defecto (ver cabecera). Artefacto solo de
      # prueba interna: sin firma y con retencion corta, no es una release.
      - name: Guardar instalador como artefacto de prueba (publicacion bloqueada)
        if: github.ref_type != 'tag' || vars.MACE_PUBLICAR_RELEASES != 'true'
        uses: actions/upload-artifact@v4
        with:
          # Sin '/' del nombre de rama: no se admite en nombres de artefacto.
          name: mace-instalador-prueba-${{ github.run_number }}
          retention-days: 3
          if-no-files-found: error
          path: |
            packaging/dist/MACE-Setup.exe
            packaging/dist/MACE-native-report.txt
            packaging/dist/SHA256SUMS-MACE.txt

      - name: Publicar en GitHub Releases
        if: github.ref_type == 'tag' && vars.MACE_PUBLICAR_RELEASES == 'true'
        run: |
          $files = @(
            'packaging\dist\MACE-Setup.exe',
            'packaging\dist\MACE-portable.zip',
            'packaging\dist\MACE-native-report.txt',
            'packaging\dist\SHA256SUMS-MACE.txt'
          )
          $notes = @"
          ## Instalacion
          1. Descarga **MACE-Setup.exe** (Windows 10/11 de 64 bits) e instalalo.
          2. Abre MACE. Uso de CPU, RAM, procesos y GPU NVIDIA/Intel funcionan sin pasos extra.

          ## Temperatura y potencia de CPU (opcional)
          Requieren el controlador **PawnIO** y abrir MACE como administrador.
          El instalador oficial va incluido sin modificar en ``app\prerequisites\PawnIO_setup.exe``;
          MACE nunca lo ejecuta por su cuenta. Sin PawnIO, MACE indica el motivo en lugar de inventar valores.

          ## Verificacion
          Compara los SHA-256 con ``SHA256SUMS-MACE.txt``. Compilado en GitHub Actions desde el tag ``$env:TAG``
          tras pasar el CI completo. Los binarios aun no tienen firma de codigo: Windows SmartScreen puede advertir.
          "@
          $flags = @('--verify-tag', '--title', "MACE $env:TAG", '--notes', $notes)
          if ($env:MACE_PRERELEASE -eq '1') { $flags += '--prerelease' }
          gh release view $env:TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG -R $env:GITHUB_REPOSITORY --clobber @files
          } else {
            gh release create $env:TAG -R $env:GITHUB_REPOSITORY @flags @files
          }
          if ($LASTEXITCODE -ne 0) { Write-Error 'No se pudo publicar en la Release.'; exit 1 }
