name: MACE CI - Build & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      # 1. Compilación de la capa nativa en C con MSVC x64
      - name: Configurar proyecto nativo en C (CMake)
        run: cmake -S native -B native/build -A x64

      - name: Compilar DLL y ejecutable de diagnostico
        run: cmake --build native/build --config Release

      - name: Verificar ejecutable nativo de diagnostico
        run: .\native\build\Release\test_mace.exe --help
        continue-on-error: true

      # 2. Enlazar el binario compilado con el proyecto Java
      - name: Provisionar DLL en app/lib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "app/lib"
          if (Test-Path "native/build/Release/mace_native.dll") {
            Copy-Item "native/build/Release/mace_native.dll" "app/lib/" -Force
          } elseif (Test-Path "native/build/Release/corepulse_native.dll") {
            Copy-Item "native/build/Release/corepulse_native.dll" "app/lib/" -Force
          } else {
            Write-Error "No se encontro la DLL compilada en native/build/Release/"
            exit 1
          }

      # 3. Pruebas de Java pasando permisos FFM y ruta de librerías nativas
      - name: Ejecutar pruebas unitarias y de integracion con Maven
        working-directory: app
        run: mvn -B clean test -DargLine="--enable-native-access=ALL-UNNAMED -Djava.library.path=lib"